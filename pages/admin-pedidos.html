id="orderSearch" placeholder="Buscar pedido, cliente ou status" aria-label="Buscar pedidos" data-test-id="admin-pedidos-input-order-search"></div><div class="tablewrap" id="orders" data-test-id="admin-pedidos-div-orders"></div><dialog id="orderModal" aria-label="Detalhes do pedido" data-test-id="admin-pedidos-dialog-order-modal"><div class="dialogtop"><h2 data-test-id="admin-pedidos-h2-h2">Gerenciar pedido</h2><button type="button" class="secondary" onclick="this.closest('dialog').close()" data-test-id="admin-pedidos-button-secondary">Fechar</button></div><div class="modal-body"></div></dialog></div></div></main><script>
const statuses=['Aguardando confirmação','Confirmado','Em separação','Enviado','Concluído','Cancelado','Arquivado'];const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function load(){let r=await fetch('/api/admin/orders');if(!r.ok){location.href='admin.html';return}let orders=await r.json(),box=document.getElementById('orders');box.replaceChildren();const table=document.createElement('table');table.innerHTML='<thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th><th>Pagamento</th><th>Ações</th></tr></thead>';const body=document.createElement('tbody');table.append(body);box.append(table);if(!orders.length)box.textContent='Nenhum pedido registrado.';for(let o of orders.reverse()){let div=document.createElement('section');div.className='order-card';let h=document.createElement('h3');h.textContent=(o.displayId||o.id)+' • '+money(o.total);div.append(h);for(let line of [o.customerName+' • '+o.email+' • '+o.phone,new Date(o.createdAt).toLocaleString('pt-BR'),o.items.map(i=>i.quantity+'x '+i.name).join(' | '),Object.values(o.address).filter(Boolean).join(', '),'Pagamento: '+o.paymentStatus+' • Frete: '+money(o.shipping)+' • Subtotal: '+money(o.subtotal)]){let p=document.createElement('p');p.textContent=line;div.append(p)}let select=document.createElement('select');statuses.forEach(s=>{let opt=document.createElement('option');opt.value=s;opt.textContent=s;opt.selected=o.status===s;select.append(opt)});let btn=document.createElement('button');btn.textContent='Atualizar status';btn.onclick=async()=>{if(select.value===o.status)return;if(['Cancelado','Arquivado','Concluído'].includes(select.value)&&!confirm('Confirma alterar o pedido '+(o.displayId||o.id)+' para '+select.value+'?')){select.value=o.status;return}btn.disabled=true;let r;try{r=await fetch('/api/admin/orders/'+encodeURIComponent(o.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});let result=await r.json();document.getElementById('message').textContent=r.ok?'Pedido atualizado.':(result.error||'Falha ao atualizar pedido.');if(r.ok){document.getElementById("orderModal").close();load()}}catch(e){document.getElementById('message').textContent='Erro de conexão.'}finally{btn.disabled=false}};if(o.status==='Aguardando confirmação'){let age=Math.floor((Date.now()-Date.parse(o.createdAt))/86400000);if(age>=7){let flag=document.createElement('p');flag.textContent='Pedido pendente há '+age+' dias — confirme com o cliente ou arquive.';flag.style.color='#ff9d24';div.append(flag)}}div.append(select,document.createTextNode(' '),btn);let pay=document.createElement('select');['Não pago','Pago na entrega','Pago antecipadamente'].forEach(v=>{let opt=document.createElement('option');opt.value=v;opt.textContent=v;opt.selected=o.paymentStatus===v;pay.append(opt)});pay.setAttribute('aria-label','Situação do pagamento');let payBtn=document.createElement('button');payBtn.textContent='Salvar pagamento';payBtn.onclick=async()=>{if(pay.value===o.paymentStatus)return;if(pay.value!=='Não pago'&&!confirm('Confirma registrar o pagamento do pedido '+(o.displayId||o.id)+' como '+pay.value+'?')){pay.value=o.paymentStatus;return}payBtn.disabled=true;try{let r=await fetch('/api/admin/orders/'+encodeURIComponent(o.id)+'/payment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentStatus:pay.value})});let result=await r.json();document.getElementById('message').textContent=r.ok?'Pagamento atualizado.':(result.error||'Falha ao atualizar pagamento.');if(r.ok){document.getElementById("orderModal").close();load()}}catch(e){document.getElementById('message').textContent='Erro de conexão.'}finally{payBtn.disabled=false}};div.append(document.createElement('br'),pay,document.createTextNode(' '),payBtn);const delivery=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Gerenciar entrega';delivery.append(summary);const fields=[['carrier','Responsável pela entrega','text',100],['estimatedDate','Data prevista','date',10],['note','Observações de entrega','text',300]];const inputs={};for(const [key,label,type,max] of fields){const wrap=document.createElement('label');wrap.style.display='block';wrap.textContent=label+' ';const inp=document.createElement('input');inp.type=type;inp.maxLength=max;inp.value=o.delivery?.[key]||'';inp.style.maxWidth='100%';wrap.append(inp);delivery.append(wrap);inputs[key]=inp}const saveDelivery=document.createElement('button');saveDelivery.textContent='Salvar entrega';saveDelivery.onclick=async()=>{saveDelivery.disabled=true;try{const payload=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value]));const r=await fetch('/api/admin/orders/'+encodeURIComponent(o.id)+'/delivery',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await r.json();document.getElementById('message').textContent=r.ok?'Entrega atualizada.':(result.error||'Falha ao atualizar entrega.')}catch(e){document.getElementById('message').textContent='Erro de conexão.'}finally{saveDelivery.disabled=false}};delivery.append(saveDelivery);div.append(delivery);const history=document.createElement('details');const historyTitle=document.createElement('summary');historyTitle.textContent='Histórico de alterações';history.append(historyTitle);for(const entry of (o.history||[]).slice().reverse()){const row=document.createElement('p');const before=typeof entry.previous==='object'?JSON.stringify(entry.previous):String(entry.previous??'—');const after=typeof entry.current==='object'?JSON.stringify(entry.current):String(entry.current??'—');row.textContent=new Date(entry.at).toLocaleString('pt-BR')+' • '+entry.actor+' • '+entry.type+': '+before+' → '+after;history.append(row)}div.append(history);const tr=document.createElement('tr');for(const value of [o.displayId||o.id,o.customerName,money(o.total),o.status,o.paymentStatus]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const action=document.createElement('td'),open=document.createElement('button');open.textContent='Ver detalhes';open.onclick=()=>{const dialog=document.getElementById('orderModal');dialog.querySelector('.modal-body').replaceChildren(div);dialog.showModal()};action.append(open);tr.append(action);body.append(tr)}}load();</script><script defer src="../js/test-selectors.js"></script></body></html>
