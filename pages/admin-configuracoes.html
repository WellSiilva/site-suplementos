<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações da loja | Well</title><link rel="stylesheet" href="../assets/admin.css"><link rel="stylesheet" href="../assets/well-fields.css"><link rel="stylesheet" href="../assets/management.css"><script defer src="../js/admin-configuracoes.js"></script></head><body><main class="management" style="max-width:1100px;margin:24px auto"><nav class="admin-nav"><a href="admin-dashboard.html">Visão geral</a> · <a href="admin-financeiro.html">Financeiro e estoque</a> · <a href="admin-configuracoes.html">Configurações</a> · <a href="admin-relatorios.html">Relatórios</a></nav><h1>Configurações da loja</h1><form id="settings"><label>Nome<input name="name" data-test-id="well-settings-name" maxlength="500"></label><label>Descrição<input name="description" data-test-id="well-settings-description" maxlength="500"></label><label>WhatsApp (55 + DDD + número)<input name="whatsapp" data-test-id="well-settings-whatsapp" maxlength="500"></label><label>E-mail de contato<input name="contactEmail" data-test-id="well-settings-contactEmail" maxlength="500"></label><label>Valor do frete (R$)<input name="shipping" data-test-id="well-settings-shipping" type="number" min="0" step="0.01" required></label><label>Frete grátis acima de (R$)<input name="freeAbove" data-test-id="well-settings-freeAbove" type="number" min="0" step="0.01" required></label><label>Instagram (URL HTTPS)<input name="instagram" data-test-id="well-settings-instagram" maxlength="500"></label><label>Horário de atendimento<input name="hours" data-test-id="well-settings-hours" maxlength="500"></label><label>Título do banner<input name="bannerTitle" data-test-id="well-settings-bannerTitle" maxlength="500"></label><label>Texto do banner<input name="bannerText" data-test-id="well-settings-bannerText" maxlength="500"></label><label>Imagem do banner (URL HTTPS)<input name="bannerUrl" data-test-id="wel
