<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Redefinir senha | Well Suplementos</title><link href="../assets/notifications.css" rel="stylesheet"/><script defer="" src="../js/notifications.js"></script><link href="../assets/accessibility.css" rel="stylesheet"/><script defer="" src="../js/accessibility.js"></script><link rel="stylesheet" href="../assets/review.css"/>
<link rel="stylesheet" href="../assets/auth-service.css?v=brand2"/><link rel="stylesheet" href="../assets/validation.css"><script defer src="../js/validation.js"></script></head><body class="well-service-page"><main data-test-id="redefinir-senha-main-main"><a class="service-brand-current" href="index.html" aria-label="Well Suplementos — início" data-test-id="redefinir-senha-a-well-suplementos-inicio">WELL<b>SUPLEMENTOS</b><small>EVOLUA TODOS OS DIAS</small></a><a data-test-id="well-redefinir-senha-content-voltar-ao-login-link" href="/pages/entrar.html">← Voltar ao login</a><h1 data-test-id="redefinir-senha-h1-h1">Redefinir senha</h1><p class="service-hint">Escolha uma nova senha com pelo menos 12 caracteres.</p><form data-test-id="well-redefinir-senha-content-form" id="form"><label data-test-id="redefinir-senha-label-label">Nova senha<input autocomplete="new-password" data-test-id="well-redefinir-senha-form-password-input" maxlength="200" minlength="12" name="password" required="" type="password"/></label><label data-test-id="redefinir-senha-label-label-2">Confirme a senha<input autocomplete="new-password" data-test-id="well-redefinir-senha-form-confirm-input" minlength="12" name="confirm" required="" type="password"/></label><button data-test-id="well-redefinir-senha-form-continuar-button" type="submit">Continuar</button><label class="show-password" data-test-id="redefinir-senha-label-show-password"><input type="checkbox" id="showPassword" data-test-id="redefinir-senha-input-show-password"/> Mostrar senhas</label></form><p aria-live="polite" id="msg" role="status" data-test-id="redefinir-senha-p-msg"></p><a id="loginAction" class="service-action" href="entrar.html" hidden data-test-id="redefinir-senha-a-login-action">Entrar na minha conta</a></main><script>document.getElementById("showPassword").addEventListener("change",e=>document.querySelectorAll("#form input[name=password],#form input[name=confirm]").forEach(i=>i.type=e.target.checked?"text":"password"));document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();if(e.target.password.value!==e.target.confirm.value){document.querySelector('#msg').textContent='As senhas não coincidem.';return}const btn=e.target.querySelector('button');btn.disabled=true;const msg=document.querySelector('#msg');msg.textContent='Processando...';try{const r=await fetch('/api/customer/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:e.target.password.value})});const d=await r.json();msg.textContent=d.message||d.error||'Não foi possível concluir a solicitação.';if(r.ok){e.target.reset();e.target.hidden=true;msg.className="success";msg.textContent="Senha alterada com sucesso! Sua conta está pronta para acessar com a nova senha.";document.getElementById("loginAction").hidden=false}else{msg.className="error"}}catch{msg.textContent='Falha de conexão. Tente novamente.'}finally{btn.disabled=false}})</script><script defer src="../js/test-selectors.js"></script></body></html>
