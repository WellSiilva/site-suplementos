<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Recuperar senha | Well Suplementos</title><link href="../assets/notifications.css" rel="stylesheet"/><script defer="" src="../js/notifications.js"></script><link href="../assets/accessibility.css" rel="stylesheet"/><script defer="" src="../js/accessibility.js"></script><link rel="stylesheet" href="../assets/review.css"/>
<link rel="stylesheet" href="../assets/validation.css"><script defer src="../js/validation.js"></script><link rel="stylesheet" href="../assets/well-fields.css?v=54"></head><body class="well-service-page"><main data-test-id="esqueci-senha-main-main"><div class="service-brand">WELL<span>SUPLEMENTOS</span></div><a data-test-id="well-esqueci-senha-content-voltar-ao-login-link" href="/pages/entrar.html">← Voltar ao login</a><h1 data-test-id="esqueci-senha-h1-h1">Recuperar senha</h1><form data-test-id="well-esqueci-senha-content-form" id="form"><label data-test-id="esqueci-senha-label-label">E-mail cadastrado<input autocomplete="email" data-test-id="well-esqueci-senha-form-email-input" maxlength="150" name="email" required="" type="email"/></label><button data-test-id="well-esqueci-senha-form-continuar-button" type="submit">Continuar</button></form><p aria-live="polite" id="msg" role="status" data-test-id="esqueci-senha-p-msg"></p></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const msg=document.querySelector('#msg');msg.textContent='Processando...';try{const r=await fetch('/api/customer/password/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.target.email.value})});const d=await r.json();msg.textContent=d.message||d.error||'Não foi possível concluir a solicitação.';if(r.ok)e.target.reset()}catch{msg.textContent='Falha de conexão. Tente novamente.'}finally{btn.disabled=false}})</script><script defer src="../js/test-selectors.js"></script></body></html>
