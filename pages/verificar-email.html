<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Verificar e-mail | Well Suplementos</title><link href="../assets/notifications.css" rel="stylesheet"/><script defer="" src="../js/notifications.js"></script><link href="../assets/accessibility.css" rel="stylesheet"/><script defer="" src="../js/accessibility.js"></script><link rel="stylesheet" href="../assets/review.css"/>
<link rel="stylesheet" href="../assets/auth-service.css?v=brand2"/><link rel="stylesheet" href="../assets/validation.css"><script defer src="../js/validation.js"></script></head><body class="well-service-page"><main data-test-id="verificar-email-main-main"><a class="service-brand-current" href="index.html" aria-label="Well Suplementos — início" data-test-id="verificar-email-a-well-suplementos-inicio">WELL<b>SUPLEMENTOS</b><small>EVOLUA TODOS OS DIAS</small></a><h1 data-test-id="verificar-email-h1-h1">Confirmação de e-mail</h1><div class="service-icon" id="stateIcon" aria-hidden="true" data-test-id="verificar-email-div-state-icon">…</div><p id="status" role="status" aria-live="polite" data-test-id="verificar-email-p-status">Verificando seu link...</p><a data-test-id="well-verificar-email-content-voltar-ao-login-link" href="entrar.html">Entrar na minha conta</a></main><script>const token=new URLSearchParams(location.search).get('token');(async()=>{let text='Link de confirmação ausente.';if(token){try{const r=await fetch('/api/customer/email/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await r.json();text=r.ok?"Seu e-mail foi confirmado! Sua conta está pronta para você aproveitar tudo o que a Well Suplementos oferece.":(data.error||"Não foi possível confirmar o e-mail.");document.getElementById("stateIcon").textContent=r.ok?"✓":"!";document.getElementById("status").className=r.ok?"success":"error"}catch{text='Erro de conexão. Tente novamente.'}}document.getElementById('status').textContent=text;if(document.getElementById('stateIcon').textContent==='…'){document.getElementById('stateIcon').textContent='!';document.getElementById('status').className='error'}})();</script><script defer src="../js/test-selectors.js"></script></body></html>
